        - generic [ref=e1069]:
          - paragraph [ref=e1072]:
            - text: "*The assessment made available on the MEDVi website does not create a doctor-patient relationship between the individual completing the assessment and MEDVi. OpenLoop Health, a network of US-licensed doctors that adhere to rigorous medical protocols designed for patient safety, has established exclusionary criteria to determine if an individual does not qualify for GLP-1s. The answers an individual provides to the MEDVi assessment consequently determine if the individual is screened out of eligibility for GLP-1 medication, and an OpenLoop Health clinician will meet with an individual after checkout to determine if they qualify for a prescription. OpenLoop Health clinicians retain the decision to prescribe compounded GLP-1s to patients."
            - text: All claims and benefits on this website refer to self-reported data from GLP-1 customers on a treatment plan that includes compounded GLP-1 medications and consultations with medical professionals. Customers reported their weight on their initial medical intake questionnaire every 3-4 weeks thereafter. Results from compounded medications found on the MEDVi platform may vary and be affected by an individual's adherence to the program and their clinician's recommendations. Compounded GLP-1s are produced in FDA-regulated facilities. Although these facilities are highly regulated, the medications are not FDA-approved or evaluated for safety, efficacy, or quality. The decision to use compounded drugs is guided by the licensed provider's medical judgment, which is informed by a telehealth consultation and medical history.
            - text: We encourage all prospective users of compounded medications to speak with their provider about the specific risks and benefits that may come with the use of compounded medication. MEDVi does not produce compounded medications, and individuals may receive medication that looks different than what is portrayed on the website.
          - paragraph [ref=e1075]:
            - text: Pharmacy Providers
            - text: We are partnered with multiple USA certified pharmacies to bring the best product and overall experience to our membership. Our team meets regularly with pharmacies to discuss any product shortages, shipping delays, and get updated reports on their medication testing.
          - paragraph [ref=e1078]: "*Results vary based on starting weight and program adherence. Inches lost from hips, waist, chest, thighs and arms in the first month. Patients exercised daily and ate a reduced-calorie diet. Their fat loss is not typical. Results may vary. Medication prescriptions are at the discretion of medical providers and may not be suitable for everyone. MEDVi patients typically result in 1-2 lbs per week weight loss after 4 weeks, involving a healthy diet and exercise changes. Consult a healthcare professional before using medication or starting any weight loss program. *Based on the average weight loss as reported by patients without diabetes who reached and maintained a dose of 2.4 mg/week of GLP-1 treatment, along with a reduced-calorie diet and increased physical activity."
          - paragraph [ref=e1081]: Medication is included in the cost of the MEDVi Program. Wegovy® is FDA-approved for weight loss. Ozempic® is FDA-approved for type 2 diabetes treatment but may be prescribed for weight loss. The trademarks, service marks, trade names (Wegovy® ,Ozempic®), and products displayed on this Internet site are protected and belong to their respetive owners. Medical treatment is provided by “CareGLP Affiliated P.C.s,” and OpenLoop Health, affiliated networks for medical professional corporations and associations. No data, photos, claims or any other information is associated with results derived from clinical trials, studies or public information and is always representative of MEDVi patient experience.
          - generic [ref=e1083]:
            - paragraph [ref=e1084]: Certain materials on this website, including text, images, and other media, may be generated or enhanced using artificial intelligence technologies. No representation or warranty is made regarding the accuracy, completeness, or reliability of such content. Individuals appearing in advertisements may be actors or models.
            - paragraph [ref=e1085]: Testimonials on the website are from MEDVi patients. For patient privacy, images representing those testimonials may use models.
            - paragraph [ref=e1086]: "By accepting our Terms of Use, you additionally understand and agree that MEDVi is not acting as a pharmacy, nor does MEDVi control or interfere with any such services. By accepting these Terms of Use, you understand and agree that you may be entering into a relationship with a pharmacy, pharmacist, and/or pharmacy group or other such relationship with any one or more such third-party entities. Partner pharmacies include:"
